<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕБАННУТАЯ - chamxmile, Vzon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="player">
            <div class="player-content" id="playerContent">
                <div class="cover-section">
                    <div class="cover-background"></div>
                    <div class="cover-wrapper">
                        <img src="cover.png" alt="Cover" class="cover" id="coverImage">

                        <!-- Кнопки управления поверх обложки -->
                        <div class="cover-controls">
                            <!-- Средний ряд: только play -->
                            <div class="cover-controls-middle">
                                <button class="cover-btn cover-btn-play" id="playButton">
                                    <img src="play.png" alt="Play" id="playIcon">
                                </button>
                            </div>

                            <!-- Нижний ряд: только кнопка текста по центру -->
                            <div class="cover-controls-bottom">
                                <button class="cover-btn cover-btn-bottom" id="lyricsToggleBtn" title="Текст песни">
                                    <img src="lyrics.png" alt="Текст" id="lyricsIcon">
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="track-info">
                        <h1>ЕБАННУТАЯ</h1>
                        <p>chamxmile, Vzon</p>
                    </div>

                    <!-- Прогресс-бар -->
                    <div class="progress-container">
                        <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
                        <div class="time">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                </div>

                <!-- Секция с текстом -->
                <div class="lyrics-section" id="lyricsSection">
                    <div class="lyrics-content" id="lyricsContent">
                        <!-- Строки добавит JS -->
                    </div>
                </div>
            </div>

            <audio id="audio" src="track.mp3"></audio>
        </div>

        <div class="comments">
            <div class="section-header">
                <h2>Комментарии</h2>
                <span id="commentCount">0</span>
            </div>
            <div class="comment-form">
                <input type="text" id="nameInput" placeholder="Имя">
                <textarea id="commentInput" placeholder="Комментарий" rows="3"></textarea>
                <button id="commentButton">Отправить комментарий</button>
            </div>
            <div class="comments-list" id="commentsList">
                <div class="empty-comments">
                    Пока комментариев нет
                </div>
            </div>
        </div>

        <div class="record-section">
            <div class="section-header">
                <h2>Голосовое</h2>
            </div>
            <button class="record-button" id="recordButton">
                <span class="record-dot"></span>
                <span id="recordText">Записать</span>
            </button>
            <div class="record-timer" id="recordTimer">0:00</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
